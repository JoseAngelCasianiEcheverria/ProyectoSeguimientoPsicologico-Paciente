# Cabeceras de seguridad para el portal, version nginx de web/_headers.
#
# Se copia a /etc/nginx/conf.d/, que nginx incluye dentro del bloque http,
# asi que estas cabeceras aplican a todas las respuestas. `always` las
# mantiene tambien en respuestas de error.
#
# La CSP tambien va en el <meta> del index.html; aqui se repite como cabecera
# para poder incluir `frame-ancestors`, que una etiqueta meta no admite.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
